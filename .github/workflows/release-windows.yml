name: Release Windows App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm.cmd ci

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ inputs.tag }}'
          } else {
            $tag = '${{ github.ref_name }}'
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw 'Release tag is required.'
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build and sign portable Windows app
        run: npm.cmd run package:win:signed
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload packaged app as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: time-assistant-windows-portable
          path: release/Time Assistant.exe
          if-no-files-found: error

      - name: Publish GitHub Release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          $assetPath = 'release/Time Assistant.exe'
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG "$assetPath#Time Assistant.exe" --clobber
          } else {
            gh release create $env:RELEASE_TAG "$assetPath#Time Assistant.exe" --title $env:RELEASE_TAG --generate-notes --target $env:GITHUB_SHA
          }
